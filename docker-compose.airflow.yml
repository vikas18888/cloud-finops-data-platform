# Day 15: run Airflow locally.  Usage:  docker compose -f docker-compose.airflow.yml up
# Then open http://localhost:8080 (user: admin, password is printed in the container logs on first start).
services:
  airflow:
    image: apache/airflow:2.9.3-python3.11
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas numpy matplotlib tabulate openpyxl"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/opt/airflow/project
